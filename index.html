<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Wocheneinkauf</title></head><body><header><div><h1>Wocheneinkauf</h1><p>Grundbedarf + Wochenmenü</p></div><button id="resetWeek" class="ghost">Neue Woche</button></header><nav><button class="tab active" data-tab="list">Einkauf</button><button class="tab" data-tab="menu">Wochenmenü</button><button class="tab" data-tab="manage">Verwalten</button></nav><main><section id="list" class="panel active"><div class="toolbar"><input id="quickAdd" placeholder="Produkt hinzufügen"><button id="quickAddBtn">+</button></div><div id="shoppingList"></div></section><section id="menu" class="panel"><div id="weekMenu"></div><button id="buildList" class="primary wide">Zutaten zur Einkaufsliste</button></section><section id="manage" class="panel"><h2>Grundbedarf</h2><p class="hint">Aktivierte Produkte erscheinen jede Woche in der Einkaufsliste.</p><div id="staples"></div><div class="toolbar"><input id="newStaple" placeholder="Neuer Grundbedarf"><select id="newStapleCat"></select><button id="addStaple">+</button></div><h2>Gerichte</h2><div id="meals"></div><div class="card"><input id="mealName" placeholder="Neues Gericht"><textarea id="mealIngredients" placeholder="Zutaten, eine pro Zeile"></textarea><button id="addMeal" class="primary">Gericht hinzufügen</button></div></section></main><script src="app.js"></script></body></html>
